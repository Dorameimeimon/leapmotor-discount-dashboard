<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f4f6f9; --card:#ffffff; --line:#e4e8ef; --line2:#eef1f6;
  --txt:#151a22; --txt2:#4a5567; --mut:#8b95a6;
  --up:#d93a34; --down:#12996b; --flat:#9aa3b2;
  --accent:#2f6bff; --accent-s:#eaf0ff; --warn-b:#f0a020;
}
body{background:var(--bg);color:var(--txt);
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased;padding:0 0 60px}
.wrap{max-width:1320px;margin:0 auto;padding:0 22px}

header{padding:30px 0 20px;border-bottom:2px solid var(--txt);margin-bottom:22px;text-align:center}
h1{font-size:25px;font-weight:700;letter-spacing:-.3px}
.sub{color:var(--txt2);font-size:13.5px;margin-top:7px}
.tagrow{margin-top:12px;display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.tag{font-size:12px;padding:3px 10px;border-radius:20px;background:#eef1f6;color:var(--txt2)}
.tag.warn{background:#fff1e8;color:#c2410c}
.tag.info{background:var(--accent-s);color:var(--accent)}
.tag.grn{background:#e6f6ee;color:#0e8a5c}
.tag.pur{background:#f1edfc;color:#6a55ce}

h2{font-size:16.5px;font-weight:700;margin-bottom:4px;display:flex;align-items:center;gap:9px}
h2 .no{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:6px;
  background:var(--txt);color:#fff;font-size:12px;font-weight:700}
.h2sub{color:var(--mut);font-size:12.5px;margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px 22px;margin-bottom:18px;
  box-shadow:0 1px 2px rgba(16,24,40,.04)}



.legend{display:flex;flex-wrap:wrap;gap:7px;margin:14px 0 4px}
.lg{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;padding:4px 10px;border:1px solid var(--line);
  border-radius:20px;cursor:pointer;user-select:none;background:#fff;transition:.12s}
.lg:hover{border-color:#c3cbd8}
.lg.off{opacity:.38;background:#f7f8fa}
.lg .dot{width:9px;height:9px;border-radius:50%}
.lg .nv{font-variant-numeric:tabular-nums;color:var(--mut);font-size:11.5px}

.chartbox{position:relative;width:100%}
svg{display:block;width:100%;height:auto;overflow:visible}
.tip{position:absolute;pointer-events:none;background:#fff;color:#111;border:1px solid #d7dde7;border-radius:8px;
  padding:9px 12px;font-size:12.5px;line-height:1.65;white-space:nowrap;opacity:0;transition:opacity .1s;z-index:20}
.tip .tt{font-weight:700;margin-bottom:5px;font-size:12px;color:#111}
.tip .tr{display:flex;align-items:center;gap:7px;font-variant-numeric:tabular-nums}
.tip .tr i{width:8px;height:8px;border-radius:50%;display:inline-block}
.tip .tr span:last-child{margin-left:auto;padding-left:12px;font-weight:600}

.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tb{padding:6px 14px;border:1px solid var(--line);border-radius:8px;font-size:13px;cursor:pointer;background:#fff;
  user-select:none;transition:.12s;font-weight:500}
.tb:hover{border-color:#c3cbd8}
.tb.on{background:var(--txt);color:#fff;border-color:var(--txt)}
.tb.dim{background:#f2f5f9;color:var(--txt2)}
.tb.dim.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.tabs .lab{font-size:12px;color:var(--mut);align-self:center;margin-right:2px}

.ctrl{display:flex;gap:4px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
@media(min-width:1170px){.ctrl{flex-wrap:nowrap}}   /* 宽屏强制控件单行 */
input[type=search]{padding:6px 10px;border:1px solid var(--line);border-radius:8px;font-size:12px;width:100px;outline:none;font-family:inherit}
input[type=search]:focus{border-color:var(--accent)}
.btn{padding:6px 9px;border:1px solid var(--line);border-radius:8px;font-size:12px;cursor:pointer;background:#fff;user-select:none}
.btn.on{background:var(--accent-s);border-color:var(--accent);color:var(--accent);font-weight:600}
.sep{width:1px;background:var(--line);height:20px;margin:0 2px}

.dd{position:relative;display:inline-block}
.ddBtn{display:flex;align-items:center;justify-content:space-between;gap:8px;min-width:88px;padding:6px 10px;
  border:1px solid #b9c2d0;border-radius:6px;font-size:12px;cursor:pointer;background:#fff;user-select:none;white-space:nowrap}
.ddBtn:hover{border-color:#8fa3c0}
.dd.open .ddBtn,.ddBtn.on{border-color:var(--accent)}
.dd.open .ddBtn{box-shadow:0 0 0 2px var(--accent-s)}
.ddBtn .ar{color:#8b95a6;font-size:11px}
/* 车型下拉收窄，保证看板3 控制栏一行放下 */
#ddVeh .ddBtn{min-width:88px}
.ddPanel{display:none;position:absolute;top:calc(100% + 5px);left:0;min-width:200px;max-height:300px;overflow:auto;
  background:#fff;border:1px solid #d7dde7;border-radius:5px;box-shadow:0 8px 24px rgba(16,24,40,.16);padding:5px 3px;z-index:60}
.dd.open .ddPanel{display:block}
.ddAct{display:flex;gap:4px;padding:3px 9px 7px;border-bottom:1px solid var(--line2);margin-bottom:4px}
.ddAct span{font-size:12px;color:var(--accent);cursor:pointer;padding:2px 7px;border-radius:4px}
.ddAct span:hover{background:var(--accent-s)}
.ddItem{display:flex;align-items:center;gap:10px;padding:7px 12px;cursor:pointer;font-size:13px;white-space:nowrap}
.ddItem:hover{background:#f2f6fd}
.ddItem i{width:15px;height:15px;border:1.5px solid #b9c2d0;border-radius:2px;flex:0 0 15px;display:inline-flex;
  align-items:center;justify-content:center;background:#fff;line-height:1}
.ddItem.ck i{background:var(--accent);border-color:var(--accent)}
.ddItem.ck i:after{content:"\2713";color:#fff;font-size:10px;font-weight:700}
.ddAct{display:flex;gap:4px;padding:4px 6px 8px;border-bottom:1px solid var(--line2);margin-bottom:6px}
.ddAct span{font-size:12px;color:var(--accent);cursor:pointer;padding:2px 7px;border-radius:5px}
.ddAct span:hover{background:var(--accent-s)}
.tblwrap{overflow:auto;max-height:620px;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:11px}
th{position:sticky;top:0;background:#f7f9fc;padding:9px 10px;text-align:right;font-weight:600;color:var(--txt2);
  font-size:11px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;z-index:2}
th:first-child,th:nth-child(2){text-align:left}
th.srt{color:var(--accent)}
td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--line2);font-variant-numeric:tabular-nums;white-space:nowrap}
td:first-child{text-align:left;color:var(--mut);width:38px}
td:nth-child(2){text-align:left;font-weight:600;min-width:140px}
td.sub2{color:var(--mut);font-weight:400;font-size:11px}
/* 所有表格数值 b 统一：11.5px / 600（与看板2 城市×车系表一致） */
table td b{font-size:11.5px;font-weight:600}
tbody tr:hover{background:#f8fafd}
tbody tr:last-child td{border-bottom:none}
table.ctr th,table.ctr td{text-align:center !important;vertical-align:middle}
table.ctr td.sub2{color:var(--txt);font-size:11px}
table.ctr th{padding:6px 8px}
table.ctr td{padding:3px 8px;line-height:1.2}
table.ctr td div{font-size:9px;line-height:1.15;margin-top:1px;color:#9aa3b2}
/* 城市×车系总表：全列等宽铺满容器（不横向滚动）+ 台数浅灰小字 + B/D 系浅色底 */
#cityTable{table-layout:fixed;width:100%}
/* fixed 布局只认首行宽度：不设像素宽 → 城市 + 4 组 colspan=5 均分容器宽，21 列一屏放下 */
#cityTable th{padding:7px 2px;font-size:11px}
/* 城市列（含合计）与「城市」表头同字号同颜色，覆盖全局 td:first-child 的浅灰 */
#cityTable td:first-child{color:var(--txt2);font-size:11px}
#cityTable td{padding:3px 2px}
#cityTable td b{font-size:11.5px;font-weight:600}
#cityTable td div{font-size:9px;line-height:1.15;margin-top:1px;color:#9aa3b2}
#cityTable .gtB{background:#f3f9fe}
#cityTable .gtD{background:#fdf6f0}
/* 两行表头吸顶：首行贴顶，次行贴在首行下方（避免滚动时 A/B/C/D 系行被次行盖住） */
#cityTable thead tr:first-child th{top:0;height:34px}
#cityTable thead tr:nth-child(2) th{top:34px;height:34px}
#cityTable thead th[rowspan="2"]{height:68px;vertical-align:middle}
/* 明细表（看板3）：全列等宽铺满容器（不横向滚动），长门店/集团名自动换行 */
#dtTable{table-layout:fixed;width:100%}
#dtTable th,#dtTable td{white-space:normal;word-break:break-word;padding-left:4px;padding-right:4px}
#dtTable td b,#dtTable td div{white-space:nowrap}
#dtTable th:first-child{width:36px}
#dtTable th:nth-child(2){width:15%}
tr.thin td{opacity:.5}
.rk{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;border-radius:5px;
  background:#f0f3f8;font-size:11px;color:var(--txt2);font-weight:600}
.rk.t1{background:#fff1e8;color:#c2410c} .rk.t2{background:#eaf0ff;color:var(--accent)}
.pos{color:var(--up);font-weight:600} .neg{color:var(--down);font-weight:600} .na{color:#c4cad4}
.pill{display:inline-block;padding:1px 7px;border-radius:5px;font-size:11.5px;font-weight:600}
.pill.hi{background:#fdecea;color:#c0392b} .pill.lo{background:#e7f6ef;color:#0f8a5f} .pill.mid{background:#f1f3f7;color:var(--txt2)}
.spark{vertical-align:middle}


.foot{margin-top:22px;padding:16px 20px;background:#fff;border:1px solid var(--line);border-radius:12px;
  font-size:12.3px;color:var(--txt2);line-height:1.85}
.foot b{color:var(--txt)}
.foot ol{margin:6px 0 0 18px}
/* 手机端：看板2/3 保持固定列宽、改为整块横向滑动，避免列被挤成一团
   （与四轮驱动看板手机查看模式一致：宽屏铺满一屏，窄屏左右滑） */
@media(max-width:900px){
  .wrap{padding:0 12px}
  .card{padding:14px 14px;margin-bottom:14px}
  .sub{font-size:11px}
  .tagrow{font-size:11px;gap:6px;flex-wrap:wrap}
  #cityTable{width:100%;min-width:1040px}
  #dtTable{width:100%;min-width:900px}
  #cityTable th,#cityTable td{padding:3px 1px}
  #dtTable th,#dtTable td{padding-left:3px;padding-right:3px}
}
</style>
</head>

    const Y=v=>PT+ih-(v/maxv)*ih;   // XPAD / X 已提升到外层作用域

      if(s==='__ALL__'){ K.forEach(x=>set.add(x)); }
      else if(set.size===K.length){ set.clear(); set.add(s); }
      else if(set.has(s)){ set.delete(s); if(!set.size) K.forEach(x=>set.add(x)); }
      else { set.add(s); }
      draw(); legend();
    });
  }

  function modes(){
    document.getElementById('modeGrp').classList.toggle('on',mode==='grp');
    document.getElementById('modeModel').classList.toggle('on',mode==='mdl');
  }
  document.getElementById('modeGrp').onclick=()=>{ mode='grp'; modes(); note(); draw(); legend(); };
  document.getElementById('modeModel').onclick=()=>{ mode='mdl'; modes(); note(); draw(); legend(); };

  box.addEventListener('mousemove',e=>{
    const r=box.getBoundingClientRect();
    const rel=(e.clientX-r.left)/r.width*W;
    let bi=0,bd=1e9;
    P.forEach((p,i)=>{const dd=Math.abs(rel-X(i)); if(dd<bd){bd=dd;bi=i}});
    const gd=document.getElementById('tGuide');
    if(gd){gd.setAttribute('x1',X(bi));gd.setAttribute('x2',X(bi));gd.setAttribute('opacity',1);}
    let h=`<div class="tt">${P[bi]}（${DATA.meta.days[bi]}天 · ${DATA.region_all[String(bi)].orders.toLocaleString()}台）</div>`;
    KEYS().filter(k=>SET().has(k)).sort((a,b)=>(valAt(b,bi)??-1)-(valAt(a,bi)??-1)).forEach(k=>{
      const v=valAt(k,bi), bd2=bandAt(k,bi);
      const prev=bi>0?valAt(k,bi-1):null, dlt=(v!=null&&prev!=null)?v-prev:null;
      const dc = dlt==null?'':(dlt>0?` <span style="color:#d92d20">▲${Math.round(dlt).toLocaleString()}</span>`:(dlt<0?` <span style="color:#067647">▼${Math.round(-dlt).toLocaleString()}</span>`:''));
      h+=`<div class="tr"><i style="background:${colorOf(k)}"></i><span>${k}</span>
        <span>${v==null?'—':Math.round(v).toLocaleString()+' 元'}${bd2?'（'+Math.round(bd2[0]).toLocaleString()+'–'+Math.round(bd2[1]).toLocaleString()+'）':''}${dc}</span></div>`;
    });
    h+=`<div class="tr" style="margin-top:5px;padding-top:5px;border-top:1px solid #e5e9f0">
      <span>大区加权</span><span>${Math.round(DATA.region_all[String(bi)].wavg).toLocaleString()} 元</span></div>`;
    tip.innerHTML=h; tip.style.opacity=1;
    const px=X(bi)/W*r.width;
    tip.style.left=(px>r.width*0.6?Math.max(px-258,4):px+16)+'px'; tip.style.top='14px';
  });
  box.addEventListener('mouseleave',()=>{tip.style.opacity=0;
    const gd=document.getElementById('tGuide'); if(gd)gd.setAttribute('opacity',0);});

})();

/* ---------- 2. 城市×车系总表（固定城市顺序） ---------- */
(function(){
  const G={'A系':['A05','A10'],'B系':['B01','B10'],'C系':['C10','C11','C16'],'D系':['D19','D99']};
  const CITY_ORDER=['广州','深圳','东莞','佛山','江门','中山','珠海','惠州','汕尾','韶关','清远','汕头',
                    '河源','揭阳','潮州','梅州','湛江','肇庆','茂名','阳江','云浮','海口','三亚'];
  // 每个车型按城市建索引
  const idx={};   // idx[model][city] = row
  Object.keys(DATA.dim['城市']).forEach(m=>{
    idx[m]={}; (DATA.dim['城市'][m]||[]).forEach(r=>{ idx[m][r.name]=r; });
  });
  // 按订单数加权：对一组车型在某个范围（城市或全区）求某期加权优惠及台数
  function wavg2(models,scope,p){
    let num=0,den=0;
    models.forEach(m=>{
      const r=scope? idx[m][scope] : null;
      const v = scope? (r?r['v'+p]:null) : DATA.region[m][String(p)].wavg;
      const o = scope? (r?r['o'+p]:0)   : DATA.region[m][String(p)].orders;
      if(v!=null&&o>0){ num+=v*o; den+=o; }
    });
    return den>0? {v:num/den,o:den} : null;
  }
  const TINT={'B系':'gtB','D系':'gtD'};   // B/D 车系列底色浅调，便于分组区分
  const cells=(g,scope)=>{
    const cls=TINT[g]||'';
    const vtd=x=>`<td class="${cls}"><b>${x?fmt(x.v):'—'}</b>${x&&x.o?`<div>${x.o}台</div>`:''}</td>`;
    const cs=[0,1,2,3].map(p=>wavg2(G[g],scope,p));
    const dlt=(cs[3]&&cs[2])?cs[3].v-cs[2].v:null;   // 环比 = 9.1-9.28 − 9.1-9.13
    return vtd(cs[0])+vtd(cs[1])+vtd(cs[2])+vtd(cs[3])+
      `<td class="${[cls,dlt==null?'na':(dlt>0?'pos':'neg')].filter(Boolean).join(' ')}">`+
      `<b style="font-weight:400">${dlt==null?'—':sign(dlt)}</b></td>`;
  };
  const GKEYS=Object.keys(G);
  const thCls=g=>TINT[g]?` class="${TINT[g]}"`:'';
  const thead='<thead><tr><th rowspan="2">城市</th>'+
    GKEYS.map(g=>`<th colspan="5"${thCls(g)}><span style="color:${CLR[G[g][0]]}">${g}</span></th>`).join('')+'</tr>'+
    '<tr>'+GKEYS.map(g=>['7月','8月','9.1-9.13','9.1-9.28','环比'].map(t=>`<th${thCls(g)}>${t}</th>`).join('')).join('')+'</tr></thead><tbody>';
  let body=`<tr style="background:#f4f7ff"><td style="font-weight:700">合计</td>`+
    GKEYS.map(g=>cells(g,null)).join('')+'</tr>';
  const seen=new Set();
  CITY_ORDER.forEach(c=>{
    seen.add(c);
    body+=`<tr><td style="font-weight:600">${c}市</td>`+GKEYS.map(g=>cells(g,c)).join('')+'</tr>';
  });
  // 固定清单之外的城市（如有）追加在最后，避免漏数
  const allCities=new Set();
  Object.keys(DATA.dim['城市']).forEach(m=>(DATA.dim['城市'][m]||[]).forEach(r=>allCities.add(r.name)));
  allCities.forEach(c=>{
    if(seen.has(c))return;
    body+=`<tr><td style="font-weight:600">${esc(c)}</td>`+GKEYS.map(g=>cells(g,c)).join('')+'</tr>';
  });
  document.getElementById('cityTable').innerHTML=thead+body+'</tbody>';
  document.getElementById('cityNote').textContent=
    '口径：优惠为订单数加权平均（元/台），下方浅灰小字为对应订单台数；环比 = 9.1-9.28 − 9.1-9.13（正=优惠扩大，红涨绿跌）。';

  /* ---- 导出图片：手工绘制到 canvas（离线零依赖），2x 清晰度，下载 PNG ---- */
  document.getElementById('cityExport').addEventListener('click',()=>{
    const FONT='-apple-system,BlinkMacSystemFont,PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif';
    const colW=86, cityW=90, MX=24, hh=34, rh=42;
    const rows=[{name:'合计',scope:null},
      ...CITY_ORDER.map(c=>({name:c+'市',scope:c}))];
    // 固定清单之外的城市（如有）追加在最后，避免漏数
    const seen=new Set(CITY_ORDER), extras=[];
    Object.keys(DATA.dim['城市']).forEach(m=>(DATA.dim['城市'][m]||[]).forEach(r=>{
      if(!seen.has(r.name)){seen.add(r.name);extras.push({name:esc(r.name)+'市',scope:r.name});}
    }));
    rows.push(...extras);
    const W=MX*2+cityW+colW*20, top=88, H=top+hh*2+rh*rows.length+20;
    const cv=document.createElement('canvas');
    cv.width=W*2; cv.height=H*2;
    const c=cv.getContext('2d'); c.scale(2,2);
    c.fillStyle='#ffffff'; c.fillRect(0,0,W,H);
    c.textBaseline='alphabetic';
    // 标题 + 口径说明
    c.fillStyle='#151a22'; c.font='700 17px '+FONT;
    c.fillText('城市 × 车系优惠总表（加权平均，元/台）',MX,40);
    c.fillStyle='#8b95a6'; c.font='12px '+FONT;
    c.fillText('口径：优惠为订单数加权平均（元/台），浅灰小字为对应订单台数；环比 = 9.1-9.28 − 9.1-9.13（正=优惠扩大，红涨绿跌）。',MX,64);
    const TINTBG={'B系':'#f3f9fe','D系':'#fdf6f0'};
    const xOf=ci=>MX+cityW+colW*ci;   // 第 ci 个数据列左缘
    // 列底色（B/D 系，含表头两行与全部数据行）
    GKEYS.forEach((g,gi)=>{ if(TINTBG[g]){
      c.fillStyle=TINTBG[g];
      c.fillRect(xOf(gi*5),top,colW*5,hh*2+rh*rows.length);
    }});
    // 合计行底色
    c.fillStyle='#f4f7ff'; c.fillRect(MX,top+hh*2,cityW+colW*20,rh);
    // 表头底色
    c.fillStyle='#f7f9fc'; c.fillRect(MX,top,cityW+colW*20,hh*2);
    // 表头文字
    c.textAlign='center';
    GKEYS.forEach((g,gi)=>{
      c.fillStyle=CLR[G[g][0]]; c.font='700 13px '+FONT;
      c.fillText(g,xOf(gi*5+2),top+hh/2+5);
      c.fillStyle='#4a5567'; c.font='600 12px '+FONT;
      ['7月','8月','9.1-9.13','9.1-9.28','环比'].forEach((t,k)=>c.fillText(t,xOf(gi*5+k)+colW/2,top+hh+hh/2+4));
    });
    c.fillStyle='#151a22'; c.font='600 13px '+FONT; c.textAlign='center';
    c.fillText('城市',MX+cityW/2,top+hh+hh/2+4);
    // 网格线（组名行内只画组边界竖线，组内竖线从子表头行开始 —— 保持合并单元格效果）
    c.strokeStyle='#e4e8ef'; c.lineWidth=1;
    for(let i=0;i<=20;i++){
      const yTop=(i%5===0)?top:top+hh;
      c.beginPath(); c.moveTo(xOf(i)+.5,yTop); c.lineTo(xOf(i)+.5,H-20); c.stroke();
    }
    c.beginPath(); c.moveTo(MX+.5,top); c.lineTo(MX+.5,H-20); c.stroke();
    c.beginPath(); c.moveTo(MX,top+hh*2+.5); c.lineTo(W-MX,top+hh*2+.5); c.stroke();
    // 数据行
    const vtext=v=> v==null?'—':Math.round(v).toLocaleString('zh-CN');
    rows.forEach((row,ri)=>{
      const y0=top+hh*2+ri*rh;
      // 行底部分隔线
      c.strokeStyle='#eef1f6'; c.beginPath(); c.moveTo(MX,y0+rh+.5); c.lineTo(W-MX,y0+rh+.5); c.stroke();
      // 城市名（居中）
      c.textAlign='center'; c.fillStyle='#151a22';
      c.font=(ri===0?'700 13px ':'600 12.5px ')+FONT;
      c.fillText(row.name,MX+cityW/2,y0+rh/2+5);
      // 20 个数据格
      GKEYS.forEach((g,gi)=>{
        const cs=[0,1,2,3].map(p=>wavg2(G[g],row.scope,p));
        cs.forEach((x,k)=>{
          const cx=xOf(gi*5+k);
          c.textAlign='center'; c.fillStyle='#151a22'; c.font='600 13px '+FONT;
          c.fillText(vtext(x?x.v:null),cx+colW/2,y0+18);
          c.fillStyle='#9aa3b2'; c.font='10.5px '+FONT;
          if(x&&x.o) c.fillText(x.o+'台',cx+colW/2,y0+33);
        });
        const dlt=(cs[3]&&cs[2])?cs[3].v-cs[2].v:null;   // 环比 = 9.1-9.28 − 9.1-9.13
        const dx=xOf(gi*5+4);
        c.textAlign='center'; c.font='600 13px '+FONT;
        c.fillStyle=dlt==null?'#c4cad4':(dlt>0?'#d93a34':'#12996b');
        c.fillText(dlt==null?'—':sign(dlt),dx+colW/2,y0+18);
      });
    });
    // 下载
    const a=document.createElement('a');
    a.download='城市×车系优惠总表_7至9.1-9.28.png';
    a.href=cv.toDataURL('image/png');
    a.click();
  });
})();

/* ---------- 3. 预警 ---------- */
(function(){
  const rows=[];
  S.forEach(s=>{
    const base=DATA.region[s]['3'].wavg;            // 对比大区 = 9.1-9.28 大区加权均价
    (DATA.dim['门店'][s]||[]).forEach(r=>{
      if(r.v3==null||r.o3<3)return;
      const dev=r.v3-base;
      const d8=(r.v2!=null&&r.v3!=null)?r.v3-r.v2:null;   // 环比 = 9.1-9.28 − 9.1-9.13
      if(!(dev>3000||(d8!=null&&d8>6000)))return;
      const sm=DATA.store_meta[r.name]||{};
      rows.push({s,n:r.name,g:sm['集团'],c:sm['城市'],mg:sm['零售经理'],v3:r.v3,dev,
        delta:d8,o3:r.o3});
    });
  });
  rows.sort((a,b)=>b.dev-a.dev);
  const clean=x=>x&&x!=='—'?x:'';
  const OPT=[...new Set(rows.map(r=>clean(r.mg)))].filter(Boolean)
    .sort((a,b)=>mgrRank(a)-mgrRank(b)||a.localeCompare(b,'zh'));
  const sel=new Set();   // 不勾＝全部（与明细表同一套交互习惯，默认即全选效果）

  function paintDD(){
    document.getElementById('ddAMgrPanel').innerHTML=
      `<div class="ddAct"><span data-aia="all">全选</span><span data-aia="clear">清空</span></div>`+
      OPT.map(o=>`<div class="ddItem ${sel.has(o)?'ck':''}" data-ai="${esc(o)}"><i></i><span>${esc(o)}</span></div>`).join('');
    const b=document.getElementById('ddAMgrBtn'), n=sel.size;
    b.innerHTML=`<span>${n===0?'全部':(n===1?esc([...sel][0]):('已选 '+n+' 项'))}</span><span class="ar">\u25BC</span>`;
    b.classList.toggle('on',n>0);
  }
  document.getElementById('ddAMgrBtn').onclick=()=>{
    const box=document.getElementById('ddAMgr');
    const was=box.classList.contains('open');
    document.querySelectorAll('.dd').forEach(d=>d.classList.remove('open'));
    if(!was) box.classList.add('open');

  document.addEventListener('click',e=>{
    if(!e.target.closest) return;
    const ac=e.target.closest('[data-aia]');
    if(ac){ ac.dataset.aia==='all' ? OPT.forEach(x=>sel.add(x)) : sel.clear(); paintDD(); render(); return; }
    const it=e.target.closest('[data-ai]');
    if(!it) return;
    const v=it.dataset.ai;
    sel.has(v)?sel.delete(v):sel.add(v);
    paintDD(); render();

  function render(){
    const rs=sel.size?rows.filter(r=>sel.has(clean(r.mg))):rows;
    document.getElementById('alertSub').innerHTML=
      `筛选：9.1-9.28 优惠高于本车型大区均价 3,000 元以上，或9.1-9.28 环比（vs 9.1-9.13）扩大 6,000 元以上；且 9.1-9.28 成交≥3 台（样本过小已剔除噪音）· 共 <b>${rs.length}</b> 条`+
      (sel.size?`（已按零售经理筛选，全部预警 ${rows.length} 条）`:'');
    document.getElementById('alertTable').innerHTML=
      `<thead><tr><th>#</th><th style="text-align:left">门店</th><th style="text-align:left">车型</th>
        <th style="text-align:left">城市</th><th style="text-align:left">集团</th><th style="text-align:left">零售经理</th>
        <th>9.1-9.28优惠</th><th>vs大区</th><th>环比Δ</th><th>9.1-9.28订单</th><th>等级</th></tr></thead><tbody>`+
      (rs.length?'':'<tr><td colspan="11" style="text-align:center;padding:24px;color:#8b95a6">无匹配数据</td></tr>')+
      rs.map((r,i)=>{
        const lv=r.dev>5000?'<span class="pill hi">高</span>':(r.dev>3000?'<span class="pill mid">中</span>':'<span class="pill lo">关注</span>');
        return `<tr><td>${i+1}</td><td style="text-align:left;font-weight:600">${esc(r.n)}</td>
          <td style="text-align:left"><span style="color:${CLR[r.s]};font-weight:700">${r.s}</span></td>
          <td class="sub2" style="text-align:left">${esc(r.c||'-')}</td>
          <td class="sub2" style="text-align:left">${esc(r.g||'-')}</td>
          <td class="sub2" style="text-align:left">${esc(r.mg||'-')}</td>
          <td><b>${yuan(r.v3)}</b></td><td class="${r.dev>0?'pos':'neg'}">${sign(r.dev)}</td>
          <td class="${r.delta>0?'pos':'neg'}">${sign(r.delta)}</td><td>${r.o3}</td><td>${lv}</td></tr>`;
      }).join('')+'</tbody>';
  }
  paintDD(); render();
})();

/* ---------- 4. 明细表（车辆口径 × 经销商口径 双维度二选一） ---------- */
(function(){
  const G={'A系':['A05','A10'],'B系':['B01','B10'],'C系':['C10','C11','C16'],'D系':['D19','D99']};
  const GN=Object.keys(G);
  const LAST=P.length-1, PREV=P.length-2;
  const st={vm:'ser', dm:'store', q:'', sort:'dev'};   // 默认：按车系 + 按门店
  let selMgr=new Set(), selGrp=new Set(), selVeh=new Set(), OPT={mgr:[],grp:[],veh:[]};  // 不勾＝全部（四轮驱动同款）

  // 车系级大区基准（W1），按订单数加权
  const gbase={};
  GN.forEach(g=>{let num=0,den=0;
    G[g].forEach(s=>{const r=DATA.region[s][String(LAST)]; if(r&&r.wavg!=null){num+=r.wavg*r.orders;den+=r.orders;}});
    gbase[g]=den>0?num/den:null;});

  function topKey(obj){ const e=Object.entries(obj); return e.length?e.sort((a,b)=>b[1]-a[1])[0][0]:'—'; }
  function cityFromGroupName(k){ const m=/-([^--]+?[市州])$/.exec(k); return m?m[1].replace(/[市州]$/,''):null; }

  function build(){
    const map={};
    S.forEach(s=>{
      const unit = st.vm==='mdl' ? s : (GN.find(g=>G[g].includes(s))||s);
      (DATA.dim['门店'][s]||[]).forEach(r=>{
        const meta=DATA.store_meta[r.name]||{};
        const key = st.dm==='store' ? r.name : (meta['集团']||r.name);
        const id=key+'||'+unit;
        const t=map[id]||(map[id]={key,unit,v:[0,0,0,0],o:[0,0,0,0],
          stores:new Set(), mgr:{}, city:{}, meta:{}});
        for(let i=0;i<P.length;i++){
          const v=r['v'+i], o=(r['o'+i]||0);
          if(v!=null&&o>0){ t.v[i]+=v*o; t.o[i]+=o; }
        }
        t.stores.add(r.name);
        const w=(r.o0||0)+(r.o1||0)+(r.o2||0)+(r.o3||0);
        if(meta['零售经理']) t.mgr[meta['零售经理']]=(t.mgr[meta['零售经理']]||0)+w;
        if(meta['城市'])     t.city[meta['城市']]=(t.city[meta['城市']]||0)+w;
        if(!t.meta['集团'])  t.meta=meta;
      });
    });
    return Object.values(map).map(t=>{
      const v=t.v.map((n,i)=> t.o[i]>0 ? n/t.o[i] : null);
      const base = st.vm==='mdl' ? DATA.region[t.unit][String(LAST)].wavg : gbase[t.unit];
      const city = st.dm==='store' ? (t.meta['城市']||'—')
                 : (cityFromGroupName(t.key) || topKey(t.city));
      const mgr  = st.dm==='store' ? (t.meta['零售经理']||'—') : topKey(t.mgr);
      return {n:t.key, unit:t.unit, city, mgr, group:t.meta['集团']||'—',
        stores:t.stores.size, v0:v[0],v1:v[1],v2:v[2],v3:v[3], o0:t.o[0],o1:t.o[1],o2:t.o[2],o3:t.o[3],
        dev:(v[LAST]!=null&&base!=null)?v[LAST]-base:null,
        wow:(v[LAST]!=null&&v[PREV]!=null)?v[LAST]-v[PREV]:null};
    });
  }

  function migrateVeh(prevVm){          // 车辆口径切换时，已选车辆做同义换算
    if(!selVeh.size || prevVm===st.vm) return;
    if(prevVm==='ser' && st.vm==='mdl'){          // 车系 -> 展开为车型
      const m=new Set(); selVeh.forEach(g=>(G[g]||[]).forEach(x=>m.add(x))); selVeh=m;
    } else if(prevVm==='mdl' && st.vm==='ser'){   // 车型 -> 收拢为车系
      const m=new Set(); selVeh.forEach(s=>{ const g=GN.find(k=>G[k].indexOf(s)>=0); if(g) m.add(g); }); selVeh=m;
    }
  }
  function seg(idA,idB,val,key){
    document.getElementById(idA).onclick=()=>{ const prev=st[key]; st[key]=val;   if(key==='vm')migrateVeh(prev); sync(); render(); };
    document.getElementById(idB).onclick=()=>{ const prev=st[key]; st[key]=(val==='mdl'?'ser':(val==='store'?'group':'mdl')); if(key==='vm')migrateVeh(prev); sync(); render(); };
  }
  function sync(){
    document.getElementById('vmMdl').classList.toggle('on',st.vm==='mdl');
    document.getElementById('vmSer').classList.toggle('on',st.vm==='ser');
    document.getElementById('dmStore').classList.toggle('on',st.dm==='store');
    document.getElementById('dmGroup').classList.toggle('on',st.dm==='group');
  }
  seg('vmMdl','vmSer','mdl','vm');
  seg('dmStore','dmGroup','store','dm');
  document.querySelectorAll('[data-dt]').forEach(el=>el.onclick=()=>{
    st.sort=el.dataset.dt;
    document.querySelectorAll('[data-dt]').forEach(x=>x.classList.toggle('on',x===el));
    render();
  });
  document.getElementById('dtq').oninput=e=>{st.q=e.target.value;render();};

  function cell(v,o){
    if(v==null&&o==0) return '<td class="na">—</td>';
    return `<td><b>${v==null?'—':Math.round(v).toLocaleString()}</b>
      <div style="font-size:9px;color:#8b95a6;font-weight:400">${o}台</div></td>`;
  }
  function clean(x){ return x && x!=='—' ? x : ''; }
  function refreshOpts(all){
    OPT.mgr=[...new Set(all.map(r=>clean(r.mgr)))].filter(Boolean).sort((a,b)=>mgrRank(a)-mgrRank(b)||a.localeCompare(b,'zh'));
    OPT.veh=(st.vm==='ser'?GN:S).slice();
    selVeh=new Set([...selVeh].filter(v=>OPT.veh.indexOf(v)>=0));
    const src = selMgr.size ? all.filter(r=>selMgr.has(clean(r.mgr))) : all;
    OPT.grp=[...new Set(src.map(r=>clean(r.group)))].filter(Boolean).sort();
    selGrp=new Set([...selGrp].filter(g=>OPT.grp.indexOf(g)>=0));   // 联动后失效的集团自动取消勾选
  }
  function paintDD(){
    const mk=(id,btnId,opts,sel,which)=>{
      const items=opts.map(o=>`<div class="ddItem ${sel.has(o)?'ck':''}" data-dd="${which}" data-v="${esc(o)}"><i></i><span>${esc(o)}</span></div>`).join('');
      document.getElementById(id).innerHTML=
        `<div class="ddAct"><span data-dda="all" data-dd2="${which}">全选</span><span data-dda="clear" data-dd2="${which}">清空</span></div>`+items;
      const b=document.getElementById(btnId);
      const n=sel.size;
      b.innerHTML=`<span>${n===0?'全部':(n===1?esc([...sel][0]):('已选 '+n+' 项'))}</span><span class="ar">\u25BC</span>`;
      b.classList.toggle('on', n>0);
    };
    mk('ddMgrPanel','ddMgrBtn',OPT.mgr,selMgr,'mgr');
    mk('ddGrpPanel','ddGrpBtn',OPT.grp,selGrp,'grp');
    mk('ddVehPanel','ddVehBtn',OPT.veh,selVeh,'veh');
    document.getElementById('vehLab').textContent = st.vm==='ser'?'车系':'车型';
  }
  ['ddMgrBtn','ddGrpBtn','ddVehBtn'].forEach(id=>{
    document.getElementById(id).onclick=()=>{
      const box=document.getElementById(id.replace('Btn',''));
      const was=box.classList.contains('open');
      document.querySelectorAll('.dd').forEach(d=>d.classList.remove('open'));
      if(!was) box.classList.add('open');
    };
  });
  document.addEventListener('click',e=>{
    if(!e.target.closest || !e.target.closest('.dd'))
      document.querySelectorAll('.dd').forEach(d=>d.classList.remove('open'));
  });
  document.addEventListener('click',e=>{
    const it=e.target.closest && e.target.closest('.ddItem');
    const ac=e.target.closest && e.target.closest('[data-dda]');
    if(ac){
      const which=ac.dataset.dd2;
      const all=(which==='mgr'?OPT.mgr:(which==='grp'?OPT.grp:OPT.veh));
      const set=(which==='mgr'?selMgr:(which==='grp'?selGrp:selVeh));
      if(ac.dataset.dda==='all'){ all.forEach(x=>set.add(x)); }
      else { set.clear(); }
      render(); return;
    }
    if(!it) return;
    const which=it.dataset.dd;
    if(which!=='mgr'&&which!=='grp'&&which!=='veh') return;   // 其他区块的下拉（如预警清单）不归这里管
    const v=it.dataset.v;
    const set=(which==='mgr'?selMgr:(which==='grp'?selGrp:selVeh));
    set.has(v)?set.delete(v):set.add(v);
    render();
  });

  let lastRows=[];   // 当前筛选+排序后的行（供导出 Excel 使用）

  function render(){
    const all=build();
    refreshOpts(all);
    let rs=all.filter(r=>(!selVeh.size||selVeh.has(r.unit)) && (!selMgr.size||selMgr.has(clean(r.mgr))) && (!selGrp.size||selGrp.has(clean(r.group))));
    if(st.q){ const q=st.q.toLowerCase();
      rs=rs.filter(r=>(r.n+' '+r.unit+' '+r.city+' '+r.mgr+' '+r.group).toLowerCase().includes(q)); }
    const cmp={dev:(a,b)=>(b.dev??-1e12)-(a.dev??-1e12),
               wow:(a,b)=>(b.wow??-1e12)-(a.wow??-1e12),
               v2:(a,b)=>(b.v2??-1)-(a.v2??-1)};
    rs.sort(cmp[st.sort]);
    lastRows=rs;
    const isStore=st.dm==='store';
    let h='<thead><tr><th>#</th>'+
      `<th style="text-align:left">${isStore?'门店名称':'集团'}</th>`+
      `<th style="text-align:left">${st.vm==='mdl'?'车型':'车系'}</th>`+
      '<th style="text-align:left">城市</th>'+
      (isStore?'<th style="text-align:left">集团</th>':'<th>门店数</th>')+
      '<th style="text-align:left">零售经理</th>'+
      P.map(p=>`<th>${p}优惠 / 台数</th>`).join('')+
      `<th>${P[LAST]} vs 大区</th><th>${P[LAST]} vs ${P[PREV]}</th></tr></thead><tbody>`;
    if(!rs.length) h+='<tr><td colspan="'+(6+P.length+2)+'" style="text-align:center;padding:24px;color:#8b95a6">无匹配数据</td></tr>';
    rs.forEach((r,i)=>{
      const dc=r.dev==null?'na':(r.dev>0?'pos':'neg');
      const wc=r.wow==null?'na':(r.wow>0?'pos':'neg');
      const uc = st.vm==='mdl' ? (CLR[r.unit]?`color:${CLR[r.unit]};font-weight:700`:'') : 'font-weight:700';
      h+=`<tr><td>${i+1}</td>
        <td style="text-align:left;font-weight:600">${esc(r.n)}</td>
        <td style="text-align:left"><span style="${uc}">${esc(r.unit)}</span></td>
        <td class="sub2" style="text-align:left">${esc(r.city||'-')}</td>
        ${isStore?`<td class="sub2" style="text-align:left">${esc(r.group||'-')}</td>`:`<td>${r.stores}</td>`}
        <td class="sub2" style="text-align:left">${esc(r.mgr||'-')}</td>`+
        cell(r.v0,r.o0)+cell(r.v1,r.o1)+cell(r.v2,r.o2)+cell(r.v3,r.o3)+
        `<td class="${dc}">${r.dev==null?'—':sign(r.dev)}</td>
        <td class="${wc}">${r.wow==null?'—':sign(r.wow)}</td></tr>`;
    });
    document.getElementById('dtTable').innerHTML=h+'</tbody>';
    paintDD();
    document.getElementById('dtNote').textContent=
      `当前显示 ${rs.length.toLocaleString()} 条 · 排序：${
        {dev:P[LAST]+' vs 大区',wow:P[LAST]+' vs '+P[PREV],v2:P[LAST]+'优惠'}[st.sort]} · 可搜索门店/集团/城市/经理/车型`;
  }
  sync(); render();

  /* ---- 导出 Excel：按当前筛选/排序状态，HTML 表格伪 xls（零依赖，Excel/WPS 可直接打开） ---- */
  document.getElementById('dtExport').onclick=()=>{
    const rs=lastRows, isStore=st.dm==='store';
    const head=['#',isStore?'门店名称':'集团',st.vm==='mdl'?'车型':'车系','城市',
      isStore?'集团':'门店数','零售经理',
      ...P.map(p=>p+'优惠(元/台)'),...P.map(p=>p+'台数'),
      P[LAST]+' vs 大区',P[LAST]+' vs '+P[PREV]];
    const td=(x,extra)=>'<td style="border:1px solid #d0d5dd;'+(extra||'')+'">'+
      (x==null?'':(typeof x==='string'?esc(x):x))+'</td>';
    const rows=rs.map((r,i)=>{
      const a=[i+1,
        td(r.n,'text-align:left'),
        td(r.unit),
        td(r.city||''),
        isStore?td(r.group||'','text-align:left'):td(r.stores),
        td(r.mgr||'','text-align:left')];
      [ [r.v0,r.o0],[r.v1,r.o1],[r.v2,r.o2],[r.v3,r.o3] ].forEach(([v,o])=>{
        a.push(td(v==null?'':Math.round(v),'mso-number-format:0;'),
               td(o||0,'mso-number-format:0;'));
      });
      a.push(td(r.dev==null?'':Math.round(r.dev),'mso-number-format:0;'),
             td(r.wow==null?'':Math.round(r.wow),'mso-number-format:0;'));
      return '<tr>'+td(a.shift())+a.join('')+'</tr>';   // 序号列在最前
    });
    const th='<tr>'+head.map(x=>'<th style="border:1px solid #d0d5dd;background:#f7f9fc;text-align:center">'+esc(x)+'</th>').join('')+'</tr>';
    const cap='<tr><td colspan="'+head.length+'" style="font-weight:700;border:none">门店明细表（'+
      (isStore?'按门店':'按集团')+' × '+(st.vm==='ser'?'按车系':'按车型')+'）· 共 '+rs.length+' 条</td></tr>';
    const html='<html xmlns:x="urn:schemas-microsoft-com:office:excel"><head><meta charset="UTF-8">'+
      '<!--[if gte mso 9]><xml><x:ExcelWorkbook><x:ExcelWorksheets><x:ExcelWorksheet>'+
      '<x:Name>门店明细</x:Name><x:WorksheetOptions><x:DisplayGridlines/></x:WorksheetOptions>'+
      '</x:ExcelWorksheet></x:ExcelWorksheets></x:ExcelWorkbook></xml><![endif]--></head><body>'+
      '<table>'+cap+th+rows.join('')+'</table></body></html>';
    const blob=new Blob(['\ufeff'+html],{type:'application/vnd.ms-excel;charset=utf-8'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download='门店明细表_'+(isStore?'按门店':'按集团')+'_'+(st.vm==='ser'?'按车系':'按车型')+'.xls';
    a.click();
    URL.revokeObjectURL(a.href);
  };
})();

</script>
